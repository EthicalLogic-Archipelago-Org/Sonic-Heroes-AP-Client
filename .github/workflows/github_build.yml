
name: Build Mod for Github

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Setup Checkout
            uses: actions/checkout@v7
    
            - name: Setup .NET Core SDK (8.0)
            uses: actions/setup-dotnet@v6
            with:
                dotnet-version: 8.0.x
    
    
            - name: Run Build
            run: dotnet build
